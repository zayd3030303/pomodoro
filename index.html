<!DOCTYPE html>
<html>

<head>

    <title>Pomodoro Timer</title>

    <style>

        body {
            background-color: #4b5e45;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: #0a1a0a;
        }

        /* بوكس المؤقت */

        #box {
            background-color: #6B8E6B;
            color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
        }

        /* أزرار اختيار الوقت */

        #box button {
            padding: 10px;
            margin: 5px;
        }

        /* بوكس الرقم */

        #time {
            background-color: rgb(255, 255, 255);
            color: #3f513f;
            font-size: 70px;
            padding: 20px;
            margin: 20px;
        }

        /* بوكس المهام */

        #tasks {
            background-color: rgb(255, 255, 255);
            width: 500px;
            margin: auto;
            padding: 20px;
        }

        input {
            padding: 10px;
        }

    </style>

</head>


<body>


    <!-- عنوان الصفحة -->

    <h1>Pomodoro Timer</h1>


    <!-- بوكس المؤقت -->

    <div id="box">


        <!-- أزرار اختيار نوع الوقت -->

        <button onclick="study()">Study</button>

        <button onclick="shortBreak()">Short Break</button>

        <button onclick="longBreak()">Long Break</button>


        <!-- الرقم -->

        <div id="time">
            25:00
        </div>


        <!-- أزرار التحكم -->

        <button onclick="start()">Start</button>

        <button onclick="pause()">Pause</button>

        <button onclick="reset()">Reset</button>


    </div>


    <br>


    <!-- قسم المهام -->

    <h2>Tasks</h2>


    <div id="tasks">


        <!-- مكان كتابة المهمة -->

        <input id="task" placeholder="Write your task">

        <button onclick="addTask()">Add</button>


        <!-- المهام تظهر هنا -->

        <div id="taskList">
        </div>


    </div>



    <script>


        // =================================
        // متغيرات الوقت
        // =================================

        var minutes = 25;

        var seconds = 0;

        var timer;


        // =================================
        // نوع الوقت الحالي
        // study = دراسة
        // short = بريك قصير
        // long = بريك طويل
        // =================================

        var mode = "study";


        // =================================
        // عدد جلسات الدراسة
        // =================================

        var studyNumber = 0;



        // =================================
        // اختيار وقت الدراسة
        // =================================

        function study() {

            clearInterval(timer);

            mode = "study";

            minutes = 25;

            seconds = 0;

            document.getElementById("time").innerHTML = "25:00";

        }



        // =================================
        // اختيار البريك القصير
        // =================================

        function shortBreak() {

            clearInterval(timer);

            mode = "short";

            minutes = 5;

            seconds = 0;

            document.getElementById("time").innerHTML = "05:00";

        }



        // =================================
        // اختيار البريك الطويل
        // =================================

        function longBreak() {

            clearInterval(timer);

            mode = "long";

            minutes = 15;

            seconds = 0;

            document.getElementById("time").innerHTML = "15:00";

        }



        // =================================
        // تشغيل المؤقت
        // =================================

        function start() {


            timer = setInterval(function() {


                // إذا الثواني وصلت إلى صفر

                if (seconds == 0) {


                    // إذا الدقائق وصلت إلى صفر
                    // يعني الوقت انتهى

                    if (minutes == 0) {


                        clearInterval(timer);


                        // =================================
                        // إذا كان وقت دراسة
                        // =================================

                        if (mode == "study") {


                            // نزيد عدد جلسات الدراسة

                            studyNumber = studyNumber + 1;


                            // =================================
                            // بعد 4 جلسات
                            // نذهب للبريك الطويل
                            // =================================

                            if (studyNumber == 4) {

                                mode = "long";

                                minutes = 15;

                                seconds = 0;

                                document.getElementById("time").innerHTML =
                                    "15:00";

                            }


                            // =================================
                            // قبل 4 جلسات
                            // نذهب للبريك القصير
                            // =================================

                            else {

                                mode = "short";

                                minutes = 5;

                                seconds = 0;

                                document.getElementById("time").innerHTML =
                                    "05:00";

                            }

                        }



                        // =================================
                        // إذا خلص البريك القصير
                        // نرجع للدراسة
                        // =================================

                        else if (mode == "short") {

                            mode = "study";

                            minutes = 25;

                            seconds = 0;

                            document.getElementById("time").innerHTML =
                                "25:00";

                        }



                        // =================================
                        // إذا خلص البريك الطويل
                        // نرجع للدراسة
                        // =================================

                        else if (mode == "long") {

                            mode = "study";

                            minutes = 25;

                            seconds = 0;

                            studyNumber = 0;

                            document.getElementById("time").innerHTML =
                                "25:00";

                        }

                    }


                    // إذا الدقائق لسه موجودة

                    else {

                        minutes = minutes - 1;

                        seconds = 59;

                    }

                }


                // إذا الثواني مش صفر

                else {

                    seconds = seconds - 1;

                }



                // =================================
                // عرض الوقت
                // =================================

                if (seconds < 10) {

                    document.getElementById("time").innerHTML =
                        minutes + ":0" + seconds;

                }

                else {

                    document.getElementById("time").innerHTML =
                        minutes + ":" + seconds;

                }


            }, 1000);

        }



        // =================================
        // إيقاف المؤقت
        // =================================

        function pause() {

            clearInterval(timer);

        }



        // =================================
        // إعادة المؤقت للبداية
        // =================================

        function reset() {

            clearInterval(timer);

            minutes = 25;

            seconds = 0;

            mode = "study";

            studyNumber = 0;

            document.getElementById("time").innerHTML =
                "25:00";

        }



        // =================================
        // إضافة مهمة
        // =================================

        function addTask() {


            var task = document.getElementById("task").value;


            var newTask = document.createElement("p");


            // نكتب المهمة مع أزرار Done و Delete

            newTask.innerHTML =
                task +
                " <button onclick='doneTask(this)'>Done</button>" +
                " <button onclick='deleteTask(this)'>Delete</button>";


            // إضافة المهمة

            document.getElementById("taskList").appendChild(newTask);


            // تفريغ مربع الكتابة

            document.getElementById("task").value = "";

        }



        // =================================
        // إنهاء المهمة
        // =================================

        function doneTask(button) {

            button.parentElement.innerHTML =
                "✓ Done";

        }



        // =================================
        // حذف المهمة
        // =================================

        function deleteTask(button) {

            button.parentElement.remove();

        }


    </script>


</body>

</html>
